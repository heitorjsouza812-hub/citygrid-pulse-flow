# Integração opcional de streaming. O modo de feira (`python iniciar.py`) não depende deste arquivo.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: citygrid_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: citygrid_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: citygrid_influxdb
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${CITYGRID_INFLUX_USERNAME:-citygrid-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${CITYGRID_INFLUX_PASSWORD:?defina CITYGRID_INFLUX_PASSWORD no arquivo .env}
      DOCKER_INFLUXDB_INIT_ORG: ${CITYGRID_INFLUX_ORG:-citygrid}
      DOCKER_INFLUXDB_INIT_BUCKET: ${CITYGRID_INFLUX_BUCKET:-citygrid}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${CITYGRID_INFLUX_TOKEN:?defina CITYGRID_INFLUX_TOKEN no arquivo .env}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: citygrid_grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${CITYGRID_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CITYGRID_GRAFANA_PASSWORD:?defina CITYGRID_GRAFANA_PASSWORD no arquivo .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/citygrid.json
      CITYGRID_INFLUX_TOKEN: ${CITYGRID_INFLUX_TOKEN}
      CITYGRID_INFLUX_ORG: ${CITYGRID_INFLUX_ORG:-citygrid}
      CITYGRID_INFLUX_BUCKET: ${CITYGRID_INFLUX_BUCKET:-citygrid}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
